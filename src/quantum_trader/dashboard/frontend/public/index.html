<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>Quantum Trader AI - Institutional Algorithmic Trading Platform</title>
    <meta name="title" content="Quantum Trader AI - Institutional Algorithmic Trading Platform" />
    <meta name="description" content="Enterprise-grade algorithmic trading platform powered by AI and quantum-inspired algorithms. Real-time market analysis, automated trading strategies, and institutional-grade risk management." />
    <meta name="keywords" content="algorithmic trading, quantitative trading, crypto trading bot, AI trading, automated trading, portfolio management, risk management, backtesting" />
    <meta name="author" content="Quantum Trader AI" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' ws://localhost:8001 wss://localhost:8001 http://localhost:8000 https://localhost:8000;
      frame-ancestors 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quantum Trader AI - Institutional Algorithmic Trading Platform" />
    <meta property="og:description" content="Enterprise-grade algorithmic trading platform powered by AI and quantum-inspired algorithms." />
    <meta property="og:site_name" content="Quantum Trader AI" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quantum Trader AI - Institutional Algorithmic Trading Platform" />
    <meta name="twitter:description" content="Enterprise-grade algorithmic trading platform powered by AI and quantum-inspired algorithms." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />

    <!-- CSS Reset & Base Styles -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;

        /* Color Palette - Dark Theme */
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-bg-tertiary: #334155;
        --color-text-primary: #f8fafc;
        --color-text-secondary: #cbd5e1;
        --color-text-muted: #94a3b8;
        --color-border: #334155;
        --color-accent: #3b82f6;
        --color-accent-hover: #2563eb;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-error: #ef4444;
        --color-info: #06b6d4;

        /* Spacing */
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;

        /* Border Radius */
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;

        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

        /* Transitions */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);

        /* Z-Index Scale */
        --z-dropdown: 1000;
        --z-sticky: 1020;
        --z-fixed: 1030;
        --z-modal-backdrop: 1040;
        --z-modal: 1050;
        --z-popover: 1060;
        --z-tooltip: 1070;
      }

      html {
        font-family: var(--font-sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'kern' 1, 'liga' 1;
        font-synthesis: none;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--color-bg-primary);
        color: var(--color-text-primary);
        overflow-x: hidden;
        position: relative;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Loading Screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }

      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 2rem;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1.5rem;
      }

      .loading-text {
        color: var(--color-text-secondary);
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.025em;
        text-align: center;
      }

      .loading-subtext {
        color: var(--color-text-muted);
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      ::-webkit-scrollbar-track {
        background: var(--color-bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-bg-tertiary);
        border-radius: 6px;
        border: 2px solid var(--color-bg-secondary);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* Selection */
      ::selection {
        background-color: rgba(59, 130, 246, 0.3);
        color: var(--color-text-primary);
      }

      ::-moz-selection {
        background-color: rgba(59, 130, 246, 0.3);
        color: var(--color-text-primary);
      }

      /* Focus Styles */
      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

      /* Accessibility - Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Print Styles */
      @media print {
        body {
          background: white;
          color: black;
        }

        .loading-screen {
          display: none !important;
        }
      }

      /* High Contrast Mode Support */
      @media (prefers-contrast: high) {
        :root {
          --color-border: #64748b;
        }
      }

      /* No Script Warning */
      .noscript-warning {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: var(--color-error);
        color: white;
        padding: 1rem;
        text-align: center;
        font-weight: 600;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="noscript-warning">
        You need to enable JavaScript to run the Quantum Trader AI dashboard.
      </div>
    </noscript>

    <!-- Root Element -->
    <div id="root">
      <!-- Loading Screen (will be hidden when React app loads) -->
      <div class="loading-screen" id="loading-screen">
        <svg class="loading-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
            </linearGradient>
          </defs>
          <!-- Quantum Symbol -->
          <circle cx="50" cy="50" r="35" fill="none" stroke="url(#logoGradient)" stroke-width="3" opacity="0.3"/>
          <circle cx="50" cy="50" r="25" fill="none" stroke="url(#logoGradient)" stroke-width="3" opacity="0.5"/>
          <circle cx="50" cy="50" r="15" fill="none" stroke="url(#logoGradient)" stroke-width="3" opacity="0.7"/>
          <circle cx="50" cy="50" r="5" fill="url(#logoGradient)"/>
          <!-- Orbital Paths -->
          <ellipse cx="50" cy="50" rx="30" ry="15" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6" transform="rotate(45 50 50)"/>
          <ellipse cx="50" cy="50" rx="30" ry="15" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6" transform="rotate(-45 50 50)"/>
        </svg>

        <div class="loading-spinner"></div>

        <div class="loading-text">
          Quantum Trader AI
          <div class="loading-subtext">Initializing Trading Platform...</div>
        </div>
      </div>
    </div>

    <!-- React Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Performance Monitoring -->
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('DOMContentLoaded', () => {
        // Performance timing
        if (window.performance && window.performance.timing) {
          window.addEventListener('load', () => {
            const timing = window.performance.timing;
            const loadTime = timing.loadEventEnd - timing.navigationStart;
            console.log(`[Performance] Page load time: ${loadTime}ms`);
          });
        }
      });

      // Global error handler
      window.addEventListener('error', (event) => {
        console.error('[Global Error]', event.error);
      });

      // Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
        console.error('[Unhandled Promise Rejection]', event.reason);
      });
    </script>
  </body>
</html>
