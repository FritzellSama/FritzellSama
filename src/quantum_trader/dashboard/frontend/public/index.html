<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Primary Meta Tags -->
    <title>Quantum Trader AI - Institutional Trading Platform</title>
    <meta name="title" content="Quantum Trader AI - Institutional Trading Platform" />
    <meta name="description" content="Advanced AI-powered trading platform managing billions in real-time across multiple exchanges with <10ms latency" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="Quantum Trader AI - Institutional Trading Platform" />
    <meta property="og:description" content="Advanced AI-powered trading platform managing billions in real-time across multiple exchanges" />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%VITE_APP_URL%" />
    <meta property="twitter:title" content="Quantum Trader AI - Institutional Trading Platform" />
    <meta property="twitter:description" content="Advanced AI-powered trading platform managing billions in real-time across multiple exchanges" />
    <meta property="twitter:image" content="%VITE_APP_URL%/twitter-image.png" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' 'unsafe-eval';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   font-src 'self' data:;
                   connect-src 'self' %VITE_API_BASE_URL% %VITE_WEBSOCKET_URL%;
                   frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Preconnect to API endpoints for performance -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" />
    <link rel="dns-prefetch" href="%VITE_API_BASE_URL%" />

    <!-- Fonts - Load from CDN or local -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Critical CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0f0f0f;
        color: #ffffff;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-in-out;
      }

      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        margin-top: 24px;
        font-size: 14px;
        color: #9ca3af;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(0.95);
        }
      }

      /* Error screen */
      .error-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f0f0f;
        z-index: 10000;
      }

      .error-screen.visible {
        display: flex;
      }

      .error-content {
        max-width: 500px;
        padding: 32px;
        text-align: center;
      }

      .error-icon {
        font-size: 64px;
        margin-bottom: 24px;
      }

      .error-title {
        font-size: 24px;
        font-weight: 700;
        color: #ef4444;
        margin-bottom: 16px;
      }

      .error-message {
        font-size: 16px;
        color: #9ca3af;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .error-button {
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background-color: #3b82f6;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .error-button:hover {
        background-color: #2563eb;
      }

      /* No JS warning */
      .no-js-warning {
        padding: 16px;
        background-color: #fef3c7;
        color: #92400e;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <!-- No JavaScript warning -->
    <noscript>
      <div class="no-js-warning">
        JavaScript is required to run Quantum Trader AI. Please enable JavaScript in your browser settings.
      </div>
    </noscript>

    <!-- Application root -->
    <div id="root">
      <!-- Loading screen -->
      <div class="loading-screen" id="loading-screen">
        <svg class="loading-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="50" stroke="#3b82f6" stroke-width="4" opacity="0.2" />
          <path d="M60 10 L110 60 L60 110 L10 60 Z" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.6" />
          <circle cx="60" cy="60" r="20" fill="#3b82f6" opacity="0.8" />
        </svg>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Quantum Trader AI...</div>
      </div>

      <!-- Error screen -->
      <div class="error-screen" id="error-screen">
        <div class="error-content">
          <div class="error-icon">⚠️</div>
          <h1 class="error-title">Failed to Load Application</h1>
          <p class="error-message" id="error-message">
            An unexpected error occurred while loading the application. Please refresh the page or contact support if the problem persists.
          </p>
          <button class="error-button" onclick="window.location.reload()">
            Reload Page
          </button>
        </div>
      </div>
    </div>

    <!-- Environment check and initialization -->
    <script>
      (function() {
        'use strict';

        // Check browser compatibility
        function checkBrowserCompatibility() {
          const requiredFeatures = [
            'Promise',
            'fetch',
            'localStorage',
            'WebSocket',
            'requestAnimationFrame'
          ];

          const missingFeatures = requiredFeatures.filter(
            feature => !(feature in window)
          );

          if (missingFeatures.length > 0) {
            showError(
              'Your browser is not supported. Please use a modern browser like Chrome, Firefox, Safari, or Edge.'
            );
            return false;
          }

          return true;
        }

        // Show error screen
        function showError(message) {
          const loadingScreen = document.getElementById('loading-screen');
          const errorScreen = document.getElementById('error-screen');
          const errorMessage = document.getElementById('error-message');

          if (loadingScreen) loadingScreen.classList.add('hidden');
          if (errorScreen) errorScreen.classList.add('visible');
          if (errorMessage) errorMessage.textContent = message;
        }

        // Hide loading screen
        function hideLoadingScreen() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            setTimeout(() => {
              loadingScreen.classList.add('hidden');
            }, 500);
          }
        }

        // Global error handler
        window.addEventListener('error', function(event) {
          console.error('Global error:', event.error);
          showError(
            'A critical error occurred. Please refresh the page or contact support.'
          );
        });

        window.addEventListener('unhandledrejection', function(event) {
          console.error('Unhandled promise rejection:', event.reason);
        });

        // Check compatibility on load
        if (!checkBrowserCompatibility()) {
          return;
        }

        // Expose function to hide loading screen
        window.__hideLoadingScreen = hideLoadingScreen;

        // Set timeout for loading screen
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
            showError(
              'Application is taking longer than expected to load. Please check your internet connection and refresh the page.'
            );
          }
        }, 30000); // 30 second timeout
      })();
    </script>

    <!-- Application bundle will be injected here by Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
