[tool.poetry]
name = "quantum-trader-ai"
version = "1.0.0"
description = "Enterprise-grade algorithmic trading platform powered by AI and quantum-inspired algorithms"
authors = ["Quantum Trader AI Team <dev@quantum-trader.production>"]
readme = "README.md"
license = "Proprietary"
packages = [
    { include = "quantum_trader" }
]

[tool.poetry.dependencies]
python = "^3.11"

# Core trading and financial libraries
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"

# Market data and broker integrations
ib-insync = "^0.9.86"
alpaca-trade-api = "^2.4.0"
pandas-market-calendars = "^4.1"

# API and web framework
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

# Database
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.13.0"

# Message queue
pika = "^1.3.0"

# Caching
redis = "^5.0.0"

# Monitoring and logging
prometheus-client = "^0.19.0"
python-json-logger = "^2.0.0"

# Distributed tracing
jaeger-client = "^4.8.0"

# Async support
aiohttp = "^3.9.0"
asyncio-contextmanager = "^1.0.0"

# Data validation and serialization
marshmallow = "^3.20.0"

# Machine learning
scikit-learn = "^1.3.0"
tensorflow = "^2.14.0"
torch = "^2.0.0"
optuna = "^3.14.0"

# Backtesting
backtrader = "^1.9.0"
zipline-reloaded = "^3.1.0"

# Utilities
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"
click = "^8.1.0"
pytz = "^2023.3"
dateparser = "^1.1.0"

# Security
cryptography = "^41.0.0"
pyjwt = "^2.8.0"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^20.0.0"
hypothesis = "^6.92.0"

# Code quality
black = "^23.12.0"
isort = "^5.13.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
pylint = "^3.0.0"

# Type stubs
types-redis = "^4.6.0"
types-requests = "^2.31.0"
sqlalchemy-stubs = "^0.4.0"

# Development and documentation
sphinx = "^7.2.0"
sphinx-rtd-theme = "^2.0.0"
mkdocs = "^1.5.0"
mkdocs-material = "^9.4.0"

[tool.poetry.group.dev.dependencies]
ipython = "^8.18.0"
jupyter = "^1.0.0"
notebook = "^7.0.0"

[tool.poetry.scripts]
quantum-trader = "quantum_trader.cli:main"
qt-backtest = "quantum_trader.backtesting:main"
qt-optimize = "quantum_trader.optimization:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_incomplete_stub = true
strict_optional = true

[[tool.mypy.overrides]]
module = "ib_insync.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alpaca_trade_api.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "backtrader.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "zipline.*"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "W0212",  # protected-access
    "R0801",  # duplicate-code
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 6
max-attributes = 8
max-branches = 12
max-locals = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=quantum_trader --cov-report=html --cov-report=term-missing --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "trading: Trading-related tests",
    "broker: Broker integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["quantum_trader"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # complex-structure
]

[tool.poetry.urls]
"Homepage" = "https://quantum-trader.production"
"Documentation" = "https://docs.quantum-trader.production"
"Repository" = "https://github.com/quantum-trader-ai/quantum-trader-ai"
"Bug Tracker" = "https://github.com/quantum-trader-ai/quantum-trader-ai/issues"
