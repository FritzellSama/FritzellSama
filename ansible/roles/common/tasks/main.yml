---
# Common tasks for all Quantum Trader servers
- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - unzip
      - build-essential
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - jq
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Configure timezone
  timezone:
    name: "{{ timezone | default('UTC') }}"

- name: Configure NTP
  apt:
    name: chrony
    state: present

- name: Start and enable chrony
  systemd:
    name: chrony
    state: started
    enabled: yes

- name: Set system limits
  pam_limits:
    domain: "*"
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  loop:
    - { limit_type: 'soft', limit_item: 'nofile', value: '65536' }
    - { limit_type: 'hard', limit_item: 'nofile', value: '65536' }
    - { limit_type: 'soft', limit_item: 'nproc', value: '32768' }
    - { limit_type: 'hard', limit_item: 'nproc', value: '32768' }

- name: Configure sysctl for performance
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.core.somaxconn', value: '65535' }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: '8192' }
    - { name: 'vm.swappiness', value: '10' }
    - { name: 'vm.dirty_ratio', value: '15' }
    - { name: 'vm.dirty_background_ratio', value: '5' }

- name: Create quantum trader group
  group:
    name: "{{ app_group | default('quantum') }}"
    state: present

- name: Create quantum trader user
  user:
    name: "{{ app_user | default('quantum') }}"
    group: "{{ app_group | default('quantum') }}"
    shell: /bin/bash
    create_home: yes

- name: Create application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user | default('quantum') }}"
    group: "{{ app_group | default('quantum') }}"
    mode: '0750'
  loop:
    - "{{ app_dir | default('/opt/quantum_trader_ai') }}"
    - "{{ log_dir | default('/var/log/quantum_trader') }}"
    - "{{ data_dir | default('/var/lib/quantum_trader') }}"
    - "{{ backup_dir | default('/var/backups/quantum_trader') }}"

- name: Configure log rotation
  template:
    src: logrotate.j2
    dest: /etc/logrotate.d/quantum_trader
    mode: '0644'

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Configure firewall (ufw)
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop:
    - { rule: 'allow', port: '22', proto: 'tcp' }
    - { rule: 'allow', port: '80', proto: 'tcp' }
    - { rule: 'allow', port: '443', proto: 'tcp' }
  when: enable_firewall | default(true)

- name: Enable firewall
  ufw:
    state: enabled
  when: enable_firewall | default(true)
