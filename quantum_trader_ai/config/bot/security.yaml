# Security Configuration
# CRITICAL: All security settings and limits

vault:
  url: "${VAULT_URL}"  # HashiCorp Vault URL from env
  token: "${VAULT_TOKEN}"  # Vault auth token from env
  mount_point: "secret"
  secrets_path: "quantum_trader"
  rotation_days: 30  # Rotate secrets every 30 days
  timeout_seconds: 10

encryption:
  algorithm: "AES-256-GCM"
  key_size_bits: 256
  iv_size_bytes: 16
  kms_provider: "aws"  # aws, gcp, azure
  kms_key_id: "${KMS_KEY_ID}"  # From environment

authentication:
  session_timeout_seconds: 3600  # 1 hour
  max_failed_attempts: 3
  lockout_duration_seconds: 900  # 15 minutes
  password_min_length: 16
  require_mfa: true
  jwt_algorithm: "RS256"
  jwt_expiry_seconds: 1800  # 30 minutes

mfa:
  enabled: true
  provider: "totp"  # totp, sms, email
  issuer: "QuantumTrader"
  token_validity_seconds: 30
  backup_codes_count: 10

rate_limiting:
  enabled: true
  default_limit_per_minute: 100
  burst_limit: 150
  api_endpoints:
    place_order: 50  # 50 orders per minute max
    cancel_order: 100
    get_balance: 200
    get_positions: 200
    market_data: 500
  violation_lockout_seconds: 300  # 5 minutes

ip_whitelist:
  enabled: true
  allowed_ips: "${ALLOWED_IPS}"  # Comma-separated from env
  allowed_cidr_ranges: "${ALLOWED_CIDR}"  # From env
  strict_mode: true
  geo_blocking_enabled: true
  allowed_countries: ["US", "UK", "SG"]  # Example

audit:
  enabled: true
  log_level: "INFO"
  log_all_operations: true
  log_retention_days: 2555  # 7 years for compliance
  log_destination: "syslog"  # syslog, file, database
  syslog_host: "${SYSLOG_HOST}"
  syslog_port: 514
  pii_masking: true

api_signing:
  algorithm: "HMAC-SHA256"
  timestamp_tolerance_seconds: 30  # Reject requests older than 30s
  nonce_required: true
  nonce_cache_size: 10000

tls:
  min_version: "1.3"  # TLS 1.3 minimum
  cipher_suites:
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_CHACHA20_POLY1305_SHA256"
  cert_path: "${TLS_CERT_PATH}"
  key_path: "${TLS_KEY_PATH}"
  verify_client_cert: true

compliance:
  soc2_enabled: true
  mifid2_enabled: true
  pci_dss_enabled: true
  gdpr_enabled: true
  data_residency: "US"
  reporting_enabled: true
  report_destination: "${COMPLIANCE_REPORT_URL}"
